<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maventro</title>
<style>
:root{--o:#f85606;--o2:#ff7a2f;--bg:#f5f5f5;--c:#fff;--t:#212121;--m:#757575;--b:#e8e8e8;--g:#25d366;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121212;--c:#1e1e1e;--t:#f0f0f0;--m:#a0a0a0;--b:#333}}
*{box-sizing:border-box}html{scroll-padding-top:70px}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.hd{background:linear-gradient(90deg,var(--o),var(--o2));position:sticky;top:0;z-index:20;padding:10px 12px;color:#fff}
.hd .row{max-width:1100px;margin:auto;display:flex;gap:10px;align-items:center}
.logo{display:flex;align-items:center;gap:6px;font-weight:800;font-size:20px;color:#fff;white-space:nowrap}.logo img{height:36px;width:auto;object-fit:contain;background:#fff;border-radius:8px;padding:3px 5px}
.sb{flex:1;display:flex;background:#fff;border-radius:8px;overflow:hidden}.sb input{flex:1;border:0;padding:10px 12px;font:inherit;outline:0;min-width:0;color:#222}.sb button{border:0;background:#ffe9dd;color:var(--o);padding:0 14px;font-weight:700}
.wrap{max-width:1100px;margin:auto;padding:12px}
.ban{border-radius:12px;background:linear-gradient(120deg,#ff5e1a,#ffb347);color:#fff;padding:22px 18px;margin-bottom:12px}.ban h1{margin:0 0 4px;font-size:24px}.ban p{margin:0;opacity:.95}
.perks{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.perks span{background:var(--c);border:1px solid var(--b);border-radius:20px;padding:6px 12px;white-space:nowrap;font-size:13px}
h2{font-size:18px;margin:14px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:900px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{background:var(--c);border-radius:8px;overflow:hidden;position:relative;display:block;box-shadow:0 1px 3px #0001}.card .im{aspect-ratio:1;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--m);font-size:12px}.card img{width:100%;height:100%;object-fit:cover}
.card .bd{padding:8px 10px 10px}.card .tt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;min-height:40px}
.pr{color:var(--o);font-weight:800;font-size:18px}.old{color:var(--m);text-decoration:line-through;font-size:12px;margin-left:6px;font-weight:400}.off{position:absolute;top:6px;left:6px;background:var(--o);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
.sold{position:absolute;inset:0 0 auto 0;background:#000a;color:#fff;text-align:center;font-size:12px;padding:4px}
.box{background:var(--c);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.back{display:inline-flex;align-items:center;gap:4px;background:var(--c);border:1px solid var(--b);color:var(--t);border-radius:20px;padding:6px 14px;margin-bottom:10px;font-weight:600}
.pg{display:grid;gap:14px}@media(min-width:760px){.pg{grid-template-columns:1fr 1fr}}
.main{width:100%;aspect-ratio:1;object-fit:contain;background:var(--bg);border-radius:10px}.th{display:flex;gap:6px;margin-top:8px;overflow:auto}.th img{width:58px;height:58px;object-fit:cover;border-radius:6px;border:2px solid transparent;cursor:pointer}.th img.on{border-color:var(--o)}
.big{font-size:28px}.btn{border:0;border-radius:10px;background:var(--o);color:#fff;font-weight:700;padding:13px 18px;width:100%;font-size:16px;display:block;text-align:center}.btn.s{width:auto;padding:8px 14px;font-size:14px}.btn.g{background:var(--g)}.btn.l{background:var(--bg);color:var(--t);border:1px solid var(--b)}.btn.r{background:#d32f2f}
.desc{white-space:pre-wrap;color:var(--t)}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px;color:var(--m)}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--b);border-radius:10px;background:var(--c);color:var(--t);font:inherit;outline:0}input:focus,select:focus,textarea:focus{border-color:var(--o)}
.of{border:2px solid var(--o);position:relative;overflow:hidden}.of::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--o),#ffb347)}
.opt{display:flex;gap:8px;flex-wrap:wrap}.opt label{margin:0;flex:1;min-width:130px;border:1.5px solid var(--b);border-radius:10px;padding:10px;cursor:pointer;display:flex;gap:8px;align-items:center;color:var(--t)}.opt input{width:auto}.opt label:has(input:checked){border-color:var(--o);background:#f856060f}
.pay{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:600px){.pay{grid-template-columns:repeat(4,1fr)}}
.pay label{flex-direction:column;justify-content:center;text-align:center;min-width:0}.pb{height:34px;display:flex;align-items:center;justify-content:center;font-weight:800;border-radius:6px;padding:0 10px;color:#fff;min-width:70px}.pb img{height:30px;max-width:100%;object-fit:contain}
.sum div{display:flex;justify-content:space-between;padding:4px 0}.sum .tot{border-top:1px dashed var(--b);margin-top:4px;padding-top8px;font-weight:800;font-size:18px;color:var(--o)}
.wa{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #0004;z-index:30;animation:pu 2s infinite}@keyframes pu{50%{box-shadow:0 0 0 10px #25d36633}}
.chat{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#fff;color:#222;border-radius:30px;padding:8px 16px 8px 8px;display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 4px 14px #0004;z-index:30}.chat i{width:34px;height:34px;border-radius:50%;background:var(--g);display:flex;align-items:center;justify-content:center}
.mo{position:fixed;inset:0;background:#000b;z-index:50;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center}.mo canvas{width:100%;max-width:420px;border-radius:12px;background:#fff}.mo .ac{display:flex;gap:8px;margin:12px 0;width:100%;max-width:420px;flex-wrap:wrap}.mo .ac>*{flex:1;min-width:120px}
.note{background:#fff4e5;border:1px solid #ffcf9a;color:#7a4300;border-radius:10px;padding:12px;margin-bottom:12px}
.ft{text-align:center;color:var(--m);font-size:13px;padding:20px 12px 90px}
.ap{display:grid;gap:10px}.al{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--b)}.al img{width:54px;height:54px;object-fit:cover;border-radius:8px;background:var(--bg)}.al .x{flex:1;min-width:0}.al .x b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pv div{position:relative}.pv img{width:64px;height:64px;object-fit:cover;border-radius:8px}.pv button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#d32f2f;color:#fff;padding:0;line-height:22px}
.tst{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:60;max-width:90%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}.cats a{font-size:12px;line-height:1.25}.cats .ci{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bg);margin-bottom:4px;display:flex;align-items:center;justify-content:center;font-size:26px}.cats img{width:100%;height:100%;object-fit:cover}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:12px;padding-bottom:2px}.tabs a{flex:0 0 auto;min-width:78px;text-align:center;padding:8px 10px;border-radius:12px;color:var(--m);font-weight:700;font-size:13px;border:1px solid transparent}.tabs a.on{border-color:#f85a5a;color:var(--o);background:var(--c)}.tabs i{display:block;font-style:normal;font-size:24px;margin-bottom:2px}
.bn{position:fixed;left:0;right:0;bottom:0;background:var(--c);border-top:1px solid var(--b);display:flex;z-index:25;padding-bottom:env(safe-area-inset-bottom,0px)}.bn a{flex:1;text-align:center;padding:7px 0;font-size:12px;color:var(--m)}.bn a.on{color:var(--o)}.bn i{display:block;font-style:normal;font-size:20px}
.hs{position:relative;border-radius:12px;overflow:hidden;min-height:180px;background:linear-gradient(120deg,#ff5e1a,#ffb347);color:#fff;margin-bottom:12px}.sd{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:translateX(50px) scale(1.06);transition:opacity .9s,transform .9s}.sd.on{opacity:1;transform:none}.ht{position:relative;padding:34px 18px;min-height:180px;display:flex;flex-direction:column;justify-content:center;text-shadow:0 2px 8px #0009;background:linear-gradient(90deg,#0005,transparent)}.ht h1{margin:0 0 6px;font-size:26px}.ht p{margin:0;white-space:pre-wrap}.dt{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px}.dt b{width:7px;height:7px;border-radius:50%;background:#fff7}.dt b.on{background:#fff;width:18px;border-radius:4px}
.wa{bottom:calc(78px + env(safe-area-inset-bottom,0px))!important}.chat{bottom:calc(78px + env(safe-area-inset-bottom,0px))!important}.wa{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;width:auto!important;height:48px!important;border-radius:30px!important;padding:0 18px 0 12px;gap:6px;color:#fff;font-weight:800;font-size:15px}.wa svg{width:26px;height:26px}.cl{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cl a{display:flex;align-items:center;gap:10px;background:var(--c);border-radius:12px;padding:10px;box-shadow:0 1px 3px #0001;font-weight:600;font-size:14px;line-height:1.2;min-width:0}.cl i{font-style:normal;width:38px;height:38px;border-radius:10px;background:#fff1e8;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto}.cl small{display:block;color:var(--m);font-weight:400;font-size:11px}.hrt{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:#fffd;color:#e91e63;font-size:18px;z-index:2;padding:0;line-height:32px}.ft{padding-bottom:110px}
</style></head>

const WAI='<svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.1 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.600 1.100 2.800s1.800 2.800 4.400 3.900c1.600.7 2.200.7 3 .6.500-.1 1.500-.6 1.700-1.200s.2-1.100.2-1.200-.2-.2-.4-.3z"/></svg>';
const logoH=()=>D.logo?`<img src="${D.logo}" alt="Maventro">`:'';
const wl=t=>`https://wa.me/${D.wa}?text=${encodeURIComponent(t)}`;
let CAT='',Q='',cur=null,gi=0;
function toast(m){const t=document.createElement('div');t.className='tst';t.textContent=m;A.appendChild(t);setTimeout(()=>t.remove(),2800)}
function card(p){const off=p.old>p.price?Math.round((1-p.price/p.old)*100):0;
return `<a class="card" href="#p-${p.id}"><div class="im">${p.imgs?.[0]?`<img src="${p.imgs[0]}" loading="lazy" alt="">`:'No image'}</div>${off?`<span class="off">-${off}%</span>`:''}<button class="hrt" data-w="${p.id}" onclick="tw('${p.id}',event)">${WISH.includes(p.id)?'♥':'♡'}</button>${p.out?'<div class="sold">Not available now</div>':''}<div class="bd"><div class="tt">${esc(p.title)}</div><div class="pr">${tk(p.price)}${off?`<span class="old">${tk(p.old)}</span>`:''}</div></div></a>`}
function head(){return `<div class="hd"><div class="row"><a class="logo" href="#home">${logoH()}Maventro</a><div class="sb"><input id="q" placeholder="Search in Maventro" value="${esc(Q)}" onkeydown="if(event.key==='Enter')doS()"><button onclick="doS()">Search</button></div></div></div>`}
function doS(){CAT='';Q=$('#q').value.trim();location.hash==='#home'||location.hash===''?r():location.hash='#home'}
function score(p,ws){const h=(p.title+' '+(p.cat||'')+' '+(p.desc||'')).toLowerCase();return ws.reduce((s,w)=>s+(h.includes(w)?1:0),0)}
const cats=()=>[...new Set(D.products.map(p=>p.cat).filter(Boolean))];
const CI=['🛍️','🏠','👗','⌚','📱','👟','🎧','🧴'];

function setCat(c){CAT=c;Q='';location.hash==='#home'?r():location.hash='#home'}
function home(){let L=D.products,msg='';if(CAT)L=L.filter(p=>(p.cat||'').toLowerCase()===CAT.toLowerCase());

c.fillStyle='#fff7f1';c.fillRect(0,0,W,H);const g=c.createLinearGradient(0,0,W,0);g.addColorStop(0,'#f85606');g.addColorStop(1,'#ff9a3c');c.fillStyle=g;c.fillRect(0,0,W,190);
const lg=await loadI(D.logo);let x=40;if(lg){const h=80,w=Math.min(220,lg.width*h/lg.height);c.fillStyle='#fff';c.beginPath();c.roundRect(40,30,w+20,h+20,14);c.fill();c.drawImage(lg,50,40,w,h);x=w+80}
c.fillStyle='#fff';c.font='bold 54px system-ui,sans-serif';c.fillText(lg?'':'Maventro',x,92);c.font='28px system-ui,sans-serif';c.fillText('ORDER CONFIRMATION',40,160);
c.textAlign='right';c.font='bold 26px system-ui,sans-serif';c.fillText('#'+o.id,W-40,92);c.font='22px system-ui,sans-serif';c.fillText(o.date,W-40,130);c.textAlign='left';
c.fillStyle='#fff';c.shadowColor='#0002';c.shadowBlur=18;c.beginPath();c.roundRect(30,215,740,200,20);c.fill();c.shadowBlur=0;
const im=await loadI(o.img);if(im){c.save();c.beginPath();c.roundRect(50,235,160,160,14);c.clip();const s=Math.max(160/im.width,160/im.height);c.drawImage(im,50+(160-im.width*s)/2,235+(160-im.height*s)/2,im.width*s,im.height*s);c.restore()}else{c.fillStyle='#eee';c.beginPath();c.roundRect(50,235,160,160,14);c.fill()}
c.fillStyle='#222';c.font='bold 28px system-ui,sans-serif';wrap(c,o.title,235,275,510,36);c.fillStyle='#f85606';c.font='bold 34px system-ui,sans-serif';c.fillText(tk(o.price)+'  ×  '+o.q,235,375);
const rows=[['Customer',o.name],['Phone',o.phone],['Address',o.addr],['Delivery area',o.area],['Payment',o.pay]];if(o.trx){rows.push(['Transaction ID',o.trx]);rows.push(['Paid from',o.snd])}
let y=470;c.fillStyle='#fff';c.shadowColor='#0002';c.shadowBlur=18;c.beginPath();c.roundRect(30,y-40,740,rows.length*76+20,20);c.fill();c.shadowBlur=0;
for(const [k,v] of rows){c.fillStyle='#888';c.font='22px system-ui,sans-serif';c.fillText(k,56,y);c.fillStyle='#222';c.font='bold 26px system-ui,sans-serif';const ny=k==='Address'?wrap(c,v,56,y+34,690,30,2):(c.fillText(v,56,y+34),y+34);y=Math.max(y+76,ny+34)}
y=Math.max(y,470+rows.length*76)+10;c.fillStyle='#fff';c.shadowColor='#0002';c.shadowBlur=18;c.beginPath();c.roundRect(30,y,740,170,20);c.fill();c.shadowBlur=0;
c.font='26px system-ui,sans-serif';c.fillStyle='#555';c.fillText('Subtotal',56,y+44);c.fillText('Delivery',56,y+84);c.textAlign='right';c.fillText(tk(o.price*o.q),744,y+44);c.fillText(tk(o.del),744,y+84);c.textAlign='left';
c.fillStyle='#f85606';c.beginPath();c.roundRect(46,y+106,708,52,12);c.fill();c.fillStyle='#fff';c.font='bold 30px system-ui,sans-serif';c.fillText('TOTAL',66,y+144);c.textAlign='right';c.fillText(tk(o.total),734,y+144);c.textAlign='left';
c.fillStyle='#888';c.font='22px system-ui,sans-serif';c.textAlign='center';c.fillText('Thank you for shopping with Maventro 💛  ·  WhatsApp: 01751109384',W/2,H-30);
return cv}
